<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Phase Diagram Simulator | SYS_READY</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="blueprint-bg"></div>
    <div class="crt-overlay"></div>
    <div class="scanline"></div>

    <div class="container">
        <header class="header">
            <div class="header-title">
                <h1>SYS_DIAGRAM::INIT</h1>
                <p>UNIVERSAL THERMODYNAMIC ENGINE v2.0</p>
            </div>
            
            <div class="system-selector">
                <label for="system-select">MODULE_SELECT_</label>
                <div class="select-wrapper">
                    <select id="system-select">
                        <option value="fe-c">Fe-C (Steel)</option>
                        <option value="cu-ag">Cu-Ag (Eutectic)</option>
                        <option value="peritectic">Generic Peritectic</option>
                    </select>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="controls-panel panel-container">
                <div class="panel-header">
                    <h2>INPUT_PARAMETERS</h2>
                </div>
                
                <div class="panel-body">
                    <div class="slider-group">
                        <label>
                            <span>ALLOY_COMP:</span>
                            <span id="comp-value" class="value-badge">30.0</span>
                        </label>
                        <input type="range" id="composition" min="0" max="100" step="0.1" value="30">
                    </div>

                    <div class="slider-group">
                        <label>
                            <span>THERMAL_STATE:</span>
                            <span id="temp-value" class="value-badge">850</span>
                        </label>
                        <input type="range" id="temperature" min="200" max="1150" step="1" value="850">
                    </div>
                </div>

                <div class="phase-analysis">
                    <div class="panel-header">
                        <h2>SYSTEM_ANALYSIS</h2>
                    </div>
                    <div class="panel-body">
                        <div id="phase-status" class="status-badge blink-text">STATUS: LIQUID + α</div>
                        <div id="bars-container" class="data-readout">
                            <!-- Bars dynamically injected here -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="plot-panel panel-container">
                <div class="panel-header">
                    <h2>VISUAL_INTERFACE_</h2>
                </div>
                <div class="panel-body plot-body">
                    <div id="phase-diagram"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
